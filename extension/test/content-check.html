<!doctype html><html><head><meta charset="utf-8"><title>Content script regression checks</title></head><body>
<label for="secret">Password</label><input id="secret" type="password">
<label for="choice">Study level</label><select id="choice" required><option value="college">College</option></select>
<label for="upload">Admission proof</label><input id="upload" type="file" required accept=".pdf">
<div><label for="styled-upload">Marksheet</label><input id="styled-upload" type="file" style="display:none" accept=".pdf"><button type="button" id="upload-document" onclick="this.dataset.clicks=String(Number(this.dataset.clicks||0)+1)">Upload document</button></div>
<label for="postal">PIN code</label><input id="postal" value="4110">
<label for="locked">Institution</label><input id="locked" required disabled>
<label for="photo">Passport size photograph *</label><input id="photo" type="file" accept=".jpg,.png">
<label for="year">Passing year</label><input id="year" name="txtPassingYear" value="2023">
<label for="otp">Enter OTP</label><input id="otp" name="txtOTP" value="123456">
<label for="cat">Category *</label><select id="cat"><option value="0">--Select--</option><option value="1">ST</option></select>
<label for="done">Stream</label><select id="done"><option value="">Choose</option><option value="a" selected>Arts</option></select>
<fieldset><legend>Gender *</legend>
  <label><input type="radio" name="g" value="m"> Male</label>
  <label><input type="radio" name="g" value="f"> Female</label>
</fieldset>
<a id="menu" href="javascript:window.__clicked = true">All Schemes</a>
<a id="away" href="https://example.com/x">Elsewhere</a>
<a id="mail" href="mailto:help@example.com">Write to us</a>
<a id="me" href="#">Welcome ASHA PATIL</a>
<a id="id" href="#">Application 20260012345</a>
<output id="result">Running</output>
<script>
// The background worker's job for "javascript:" links (clicking inside the page) is played by this stub.
window.chrome={runtime:{sendMessage:(m)=>{ if (m && m.type === 'page-click') document.querySelector('[data-ts-click="' + m.token + '"]')?.click(); },onMessage:{addListener:fn=>window.receive=fn,removeListener(){}}}};
Object.defineProperty(document.getElementById('secret'),'value',{get(){throw new Error('Sensitive value was read');}});
</script><script src="../content.js"></script><script>
const fail = (m) => { throw Error(m); };
window.receive({type:'page-info'}, {}, response=>{
try {
 if(!response.ok) throw Error(response.reason);
 const fields=response.fields;
 const by = (label) => fields.find(f=>f.label===label);
 if(by('Password').value !== undefined) fail('Secret returned');
 if(!by('Study level').filled) fail('Valid first option not recognised');
 if(by('PIN code').sensitive) fail('Postal code treated as secret');
 if(!by('Institution').disabled) fail('Disabled flag missing');
 if(by('Admission proof').accept!=='.pdf') fail('Accept constraint missing');
 const styled=by('Marksheet');
 if(!styled) fail('Styled upload input not detected');
 // Words that only look like secrets
 if(!by('Passport size photograph') || by('Passport size photograph').sensitive) fail('Passport photo upload treated as private');
 if(by('Passing year').sensitive || by('Passing year').value !== '2023') fail('Passing year treated as private');
 if(!by('Enter OTP').sensitive || by('Enter OTP').value !== undefined) fail('OTP field not private');
 // Selects: a placeholder is not an answer, a real choice is
 if(by('Category').filled) fail('--Select-- placeholder counted as an answer');
 if(!by('Stream').filled) fail('Real selection not counted');
 // Radio group: one caption, required from the legend asterisk
 const radios = fields.filter(f=>f.type==='radio');
 if(radios.length !== 2 || radios.some(r=>r.group !== 'Gender' || !r.required)) fail('Radio group caption or required flag missing: ' + JSON.stringify(radios.map(r=>[r.group,r.required])));
 // Menu text with a person name or id never leaves the page
 window.receive({type:'page-info'}, {}, (again) => {
   const links = again.info.links;
   if (!links.includes('All Schemes')) fail('Menu link missing');
   if (links.some(l => /ASHA|2026001/.test(l))) fail('Personal text in link list: ' + links);
 });
 // Ids stay unique and stable between scans
 const ids = fields.map(f=>f.id);
 if (new Set(ids).size !== ids.length) fail('Duplicate field ids');
 // Navigation: javascript: menu links work, other sites and mail links do not
 const js = {}; window.receive({type:'goto', label:'All Schemes'}, {}, (r) => { js.r = r; });
 if (!js.r || !js.r.ok) fail('javascript: menu link refused: ' + JSON.stringify(js.r));
 window.receive({type:'goto', label:'Elsewhere'}, {}, (r) => { if (r.ok || r.reason !== 'external-link') fail('External link was followed'); });
 window.receive({type:'goto', label:'Write to us'}, {}, (r) => { if (r.ok) fail('mailto link was followed'); });
 window.receive({type:'attach',id:styled.id,name:'marksheet.pdf',mime:'application/pdf',b64:btoa('%PDF-1.4\n%%EOF')}, {}, result=>{
   if(!result.ok || document.getElementById('styled-upload').files[0]?.name!=='marksheet.pdf') fail('File selection failed');
 });
 // A field-specific upload is single-use; changing its file invalidates confirmation.
 let offer;
 window.receive({type:'prepare-upload', id:styled.id}, {}, r=>offer=r);
 if(!offer?.ok) fail('Upload control not identified');
 window.receive({type:'upload-document',token:offer.token}, {}, r=>{if(!r.ok) fail('Upload click failed');});
 window.receive({type:'upload-document',token:offer.token}, {}, r=>{if(r.ok) fail('Upload token replay accepted');});
 if(document.getElementById('upload-document').dataset.clicks!=='1') fail('Upload was not clicked exactly once');
 window.receive({type:'attach',id:styled.id,name:'marksheet.pdf',mime:'application/pdf',b64:btoa('%PDF-1.4\n%%EOF')}, {}, ()=>{});
 window.receive({type:'prepare-upload',id:styled.id}, {}, r=>offer=r);
 document.getElementById('styled-upload').value='';
 window.receive({type:'upload-document',token:offer.token}, {}, r=>{if(r.ok) fail('Changed file accepted');});
 document.getElementById('upload-document').textContent='Submit Application';
 window.receive({type:'prepare-upload',id:styled.id}, {}, r=>{if(r.ok) fail('Final submission offered');});
 // Private upload targets are refused; a passport photo is not private
 window.receive({type:'attach',id:by('Passport size photograph').id,name:'p.png',mime:'image/png',b64:btoa('\x89PNG\r\n')}, {}, (r) => { if (!r.ok) fail('Passport photo could not be selected: ' + r.reason); });
 setTimeout(() => {
   try {
     if (window.__clicked !== true) fail('The guide did not click the javascript: menu link');
     document.getElementById('result').textContent='CONTENT CHECKS PASSED';
   } catch (e) { document.getElementById('result').textContent='FAILED: '+e.message; }
 }, 700);
} catch(e) { document.getElementById('result').textContent='FAILED: '+e.message; }
});
</script></body></html>
