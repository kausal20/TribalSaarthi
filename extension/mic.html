<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Allow the microphone · TribalSaarthi</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.6 'Segoe UI', system-ui, sans-serif; color: #1e3b2e; background: #f3f8f5; }
      .card { max-width: 460px; margin: 24px; padding: 28px; text-align: center; background: #fff; border: 1px solid #dce6df; border-radius: 20px; box-shadow: 0 18px 40px -24px rgba(17, 24, 39, 0.35); }
      .ic { display: grid; place-items: center; width: 56px; height: 56px; margin: 0 auto 14px; color: #fff; background: #173d30; border-radius: 18px; }
      h1 { margin: 0 0 8px; font-size: 1.3rem; }
      p { margin: 0 0 12px; color: #52615c; }
      #status { min-height: 1.6em; font-weight: 600; color: #0b6e5f; }
      #status.bad { color: #b42318; }
      button { min-height: 44px; padding: 0 20px; font: inherit; font-weight: 700; color: #fff; background: #0f8b78; border: 0; border-radius: 999px; cursor: pointer; }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="ic" aria-hidden="true"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3m-4 0h8"/></svg></div>
      <h1>Allow the microphone for voice questions</h1>
      <p>Chrome cannot ask for the microphone inside the side panel, so it asks here once. Choose <strong>Allow</strong>. Then go back to the guide and press the microphone again.</p>
      <p id="status" role="status" aria-live="polite">Waiting for your choice…</p>
      <button id="again" type="button" hidden>Ask again</button>
    </main>
    <script src="mic.js"></script>
  </body>
</html>
